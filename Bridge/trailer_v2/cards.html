<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Impact,'Arial Black',sans-serif}
.c{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
body.logo #logo,body.soon #soon,body.follow #follow{display:flex}
/* LOGO */
.shield{width:230px;height:290px;position:relative;filter:drop-shadow(0 0 40px rgba(255,140,0,.8)) drop-shadow(0 10px 20px #000)}
.shield svg{width:100%;height:100%}
.t1{font-size:250px;letter-spacing:6px;line-height:1;margin-top:-14px;color:#ffd84a;
 background:linear-gradient(180deg,#fff9c4 0%,#ffe066 30%,#ffb300 55%,#ff6a00 56%,#ffcf40 80%,#ff9d00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 -webkit-text-stroke:3px #7a2c00;filter:drop-shadow(0 0 30px rgba(255,150,0,.85)) drop-shadow(0 12px 0 #5a1d00) drop-shadow(0 22px 26px #000)}
.t2{margin-top:6px;padding:6px 120px;font-size:96px;letter-spacing:30px;text-indent:30px;color:#fff;background:linear-gradient(180deg,#ff5a2a,#d11a00);
 clip-path:polygon(40px 0,100% 0,calc(100% - 40px) 100%,0 100%);box-shadow:0 0 40px #f30;text-shadow:0 4px 0 #6d0b00;border-top:4px solid #ff9a7a}
.line{width:1100px;height:3px;margin-top:26px;background:linear-gradient(90deg,transparent,#ffcf40,transparent)}
/* SOON */
.s1{font-size:70px;letter-spacing:34px;text-indent:34px;color:#cfd3dc;font-family:'Bahnschrift',sans-serif;font-weight:300;text-shadow:0 0 18px rgba(255,255,255,.35)}
.s2{white-space:nowrap;font-size:270px;line-height:1;letter-spacing:12px;color:#fff;margin-top:6px;
 background:linear-gradient(180deg,#fff 0%,#ffd84a 45%,#ff5a1a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px #5a1500;
 filter:drop-shadow(0 0 40px rgba(255,90,0,.8)) drop-shadow(0 14px 0 #4a1100) drop-shadow(0 24px 30px #000)}
.badge{margin-top:40px;display:flex;gap:26px;align-items:center;font-family:'Bahnschrift',sans-serif;font-size:56px;letter-spacing:14px;color:#ffd84a;font-weight:700}
.badge i{display:inline-block;width:70px;height:70px}
.sub{margin-top:30px;font-family:'Bahnschrift',sans-serif;font-size:36px;letter-spacing:10px;color:#9aa0ad}
/* FOLLOW */
.av{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a3a,#d11a00 60%,#6d0b00);border:8px solid #ffd84a;box-shadow:0 0 70px rgba(255,120,0,.8);display:flex;align-items:center;justify-content:center;font-size:170px;color:#fff;text-shadow:0 8px 0 #5a1000}
.k1{margin-top:34px;font-size:150px;letter-spacing:10px;background:linear-gradient(180deg,#fff,#ffd84a 60%,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px #5a1d00;filter:drop-shadow(0 0 28px rgba(255,140,0,.7)) drop-shadow(0 10px 0 #4a1100) drop-shadow(0 18px 24px #000)}
.k2{margin-top:6px;font-family:'Bahnschrift',sans-serif;font-size:50px;letter-spacing:12px;color:#e6e8ee;font-weight:600}
.btn{margin-top:46px;display:flex;align-items:center;gap:26px;background:#ff0000;border-radius:22px;padding:22px 56px;font-family:'Bahnschrift',sans-serif;font-size:64px;font-weight:700;color:#fff;box-shadow:0 0 60px rgba(255,0,0,.55),0 12px 0 #8a0000}
.btn svg{width:84px;height:60px}
.k3{margin-top:34px;font-family:'Bahnschrift',sans-serif;font-size:40px;letter-spacing:6px;color:#aeb3c0}
</style></head><body>
<div class="c" id="logo">
 <div class="shield"><svg viewBox="0 0 230 290"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a2a"/><stop offset="1" stop-color="#b01400"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#d9d2b8"/></linearGradient><clipPath id="cp"><path d="M12 12H218V150C218 220 160 262 115 280C70 262 12 220 12 150Z"/></clipPath></defs>
 <g clip-path="url(#cp)"><rect x="0" y="0" width="115" height="290" fill="url(#g1)"/><rect x="115" y="0" width="115" height="290" fill="url(#g2)"/></g>
 <path d="M12 12H218V150C218 220 160 262 115 280C70 262 12 220 12 150Z" fill="none" stroke="#ffcf40" stroke-width="12" stroke-linejoin="round"/>
 <g transform="translate(115 128)" fill="none" stroke="#3b1a14" stroke-width="13"><circle r="56"/><circle r="11" fill="#3b1a14"/><path d="M-52 10 L-11 4M52 10 L11 4M0 11V55" stroke-linecap="round"/></g></svg></div>
 <div class="t1">CITY DRIVER</div><div class="t2">UNDERCOVER</div><div class="line"></div>
</div>
<div class="c" id="soon"><div class="s1">THE NIGHT SHIFT BEGINS</div><div class="s2">COMING SOON</div>
 <div class="badge"><i><svg viewBox="0 0 24 24" fill="#ffd84a"><path d="M17.6 9.5l1.7-3a.4.4 0 00-.7-.4l-1.7 3A10 10 0 0012 8.1c-1.7 0-3.3.4-4.9 1l-1.7-3a.4.4 0 00-.7.4l1.7 3A9 9 0 003 17h18a9 9 0 00-3.4-7.5zM8.5 14.6a.9.9 0 110-1.8.9.9 0 010 1.800zm7 0a.9.9 0 110-1.8.9.9 0 010 1.800z"/></svg></i>ANDROID</div></div>
<div class="c" id="follow"><div class="av">K</div><div class="k1">KARTHI LAB</div><div class="k2">FOLLOW THE BUILD · WATCH IT GROW</div>
 <div class="btn"><svg viewBox="0 0 84 60"><rect width="84" height="60" rx="16" fill="#fff"/><path d="M33 17L58 30 33 43z" fill="#f00"/></svg>FOLLOW ON YOUTUBE</div><div class="k3">LIKE · SUBSCRIBE · TURN ON THE BELL</div></div>
</body></html>
