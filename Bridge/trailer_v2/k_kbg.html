<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Bahnschrift',sans-serif}
body.kbg{background:radial-gradient(ellipse 55% 50% at 50% 46%,#16336e 0%,#0a1430 50%,#03060f 100%)}
body.kbg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(90,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,255,.07) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 48%,#000,transparent 75%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 0 26px rgba(70,150,255,.9))}
body.kintro .logo{width:1250px;margin-top:-40px}
.pres{position:absolute;top:720px;left:0;right:0;text-align:center;font-size:46px;letter-spacing:26px;text-indent:26px;color:#bcd2ff;text-shadow:0 0 18px rgba(80,150,255,.8)}
body.kfollow .logo{width:880px;margin-top:-50px}
.f1{margin-top:-30px;font-size:60px;letter-spacing:14px;text-indent:14px;color:#e8f0ff;font-weight:700;text-shadow:0 0 20px rgba(80,150,255,.8)}
.btnrow{margin-top:40px;display:flex;align-items:center;gap:30px}
.btn{display:flex;align-items:center;gap:22px;background:#f00;border-radius:20px;padding:20px 56px;font-size:60px;font-weight:700;color:#fff;box-shadow:0 0 60px rgba(255,0,0,.5),0 10px 0 #8a0000;letter-spacing:4px}
.btn svg{width:78px;height:55px}
.bell{width:104px;height:104px;border-radius:50%;background:#1b2a50;border:3px solid #5d90ff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(80,150,255,.6)}
.bell svg{width:56px;height:56px}
.f3{margin-top:34px;font-size:38px;letter-spacing:8px;text-indent:8px;color:#9db7ee}
</style></head><body class="kbg">
<div style="display:none" class="c" id="i"><img class="logo" src="klogo.png"></div>
<div style="display:none" class="pres" id="p">PRESENTS</div>
<div style="display:none" class="c" id="f"><img class="logo" src="klogo.png"><div class="f1">FOLLOW ON YOUTUBE</div>
<div class="btnrow"><div class="btn"><svg viewBox="0 0 84 60"><rect width="84" height="60" rx="16" fill="#fff"/><path d="M33 17L58 30 33 43z" fill="#f00"/></svg>SUBSCRIBE</div>
<div class="bell"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.4 2.4 0 002.4-2.4h-4.8A2.4 2.4 0 0012 22zm7-6.4v-5c0-3.4-1.8-6.100-5-6.900V3a2 2 0 00-4 0v.7c-3.200.8-5 3.500-5 6.900v5l-2 2V19h18v-1.400z"/></svg></div></div>
<div class="f3">LIKE · SHARE · TURN ON NOTIFICATIONS</div></div>
</body></html>
